name: Unpack static site

on:
  push:
    branches:
      - main
    paths:
      - 'site.tar.gz.part-*'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack website files
        run: |
          cat site.tar.gz.part-* > site.tar.gz
          tar -xzf site.tar.gz
          rm -f site.tar.gz site.tar.gz.part-*
      - name: Commit unpacked site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish complete INTERGEO 2026 site"
          git push
